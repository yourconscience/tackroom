version: 2

project_name: tackroom

builds:
  - id: tackroom
    dir: cmd/tackroom
    main: .
    binary: tackroom
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/yourconscience/tackroom/internal/app.Version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: yourconscience
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    description: "Sync skills, MCP servers, hooks, and roles across coding agents"
    homepage: "https://github.com/yourconscience/tackroom"
    license: MIT

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
