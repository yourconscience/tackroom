version: 1
agents: [] # populated by tackroom setup

external_skills:
  - url: https://github.com/mattpocock/skills
    branch: main
    skill_dirs: [skills/productivity/grilling]
    materialize: true

hooks:
  - name: memory-session-start
    enabled: true
    event: SessionStart
    command: python3 ~/.agents/memory/hooks/basic-session-start.py
    timeout: 15
    agents: [claude-code]
  - name: memory-session-end
    enabled: true
    event: SessionEnd
    command: python3 ~/.agents/memory/hooks/basic-session-end.py
    timeout: 30
    agents: [claude-code]
