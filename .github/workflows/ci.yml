name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            # Extract YAML between --- delimiters
            fm=$(awk '/^---$/{if(n++)exit;next}n' "$f")
            if [ -z "$fm" ]; then
              echo "FAIL: $f - no frontmatter"
              fail=1
              continue
            fi
            # Check name and description exist
            name=$(echo "$fm" | grep -oP '^name:\s*\K.*' | sed 's/^["'"'"']//;s/["'"'"']$//')
            desc=$(echo "$fm" | grep -oP '^description:\s*\K.*' | sed 's/^["'"'"']//;s/["'"'"']$//')
            if [ -z "$name" ] || [ -z "$desc" ]; then
              echo "FAIL: $f - missing name or description"
              fail=1
              continue
            fi
            # Validate YAML parses (catch unquoted colons etc.)
            if ! echo "$fm" | python3 -c "import sys,yaml; yaml.safe_load(sys.stdin)" 2>/tmp/yaml-err; then
              echo "FAIL: $f - invalid YAML: $(cat /tmp/yaml-err)"
              fail=1
              continue
            fi
            echo "OK: $f ($name)"
          done
          exit $fail

  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  memory-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test memory hooks and lib
        run: python3 -m unittest discover -s memory/tests

  release-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test release script validation
        run: sh scripts/release_test.sh

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test npm wrapper
        run: node --test npm/install.test.js

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the macOS app
        working-directory: macos
        run: swift build && swift test
